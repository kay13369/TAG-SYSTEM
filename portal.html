<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Portal · TAG</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=13" />
</head>
<body class="app-body">

  <!-- Looping tech background -->
  <div class="bg-loop" aria-hidden="true">
    <div class="bg-loop__slide s1"></div>
    <div class="bg-loop__slide s2"></div>
    <div class="bg-loop__slide s3"></div>
    <div class="bg-loop__slide s4"></div>
    <div class="bg-loop__veil"></div>
  </div>

  <div class="app">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <a href="index.html" class="brand brand--stack" aria-label="Technology Affiliates Group — home">
        <img class="brand__logo" src="assets/tag-logo-dark.png" alt="Technology Affiliates Group" />
        <small>Client Portal</small>
      </a>
      <nav class="sidebar__nav" id="sideNav">
        <a href="#" data-view="dashboard" class="active"><span class="ic">📊</span> Dashboard</a>
        <a href="#" data-view="tickets"><span class="ic">🎫</span> My Tickets</a>
        <a href="#" data-view="quotes"><span class="ic">📄</span> Quotes</a>
        <a href="shop.html"><span class="ic">🛒</span> Shop</a>
        <a href="#" data-view="profile"><span class="ic">👤</span> Profile</a>
      </nav>
      <div class="sidebar__user">
        <div class="who">
          <div class="avatar" id="userAvatar">?</div>
          <div><div class="nm" id="userName">—</div><div class="rl" id="userRole">client</div></div>
        </div>
        <button class="btn btn-light btn-sm btn-block" id="logoutBtn">Sign out</button>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="topbar">
        <div style="display:flex;align-items:center;gap:14px">
          <button class="btn btn-ghost btn-sm" id="menuBtn" style="display:none">☰</button>
          <div><h1 id="pageTitle">Dashboard</h1><div class="sub" id="pageSub">Welcome back</div></div>
        </div>
        <button class="btn btn-primary btn-sm" id="newTicketBtn">+ New Ticket</button>
      </div>
      <div class="content" id="content"><!-- views render here --></div>
    </main>
  </div>

  <!-- NEW TICKET MODAL -->
  <div class="modal-overlay" id="ticketModal">
    <div class="modal">
      <div class="modal__head"><h3>Log a support ticket</h3><button class="modal__close" data-close="ticketModal">&times;</button></div>
      <div class="modal__body">
        <form id="ticketForm" novalidate>
          <div class="field"><label for="tSubject">Subject</label><input id="tSubject" type="text" placeholder="Short summary of the issue" /><div class="err">Please add a subject.</div></div>
          <div class="field-row">
            <div class="field"><label for="tCategory">Category</label>
              <select id="tCategory">
                <option>IT Infrastructure & Support</option>
                <option>Cybersecurity</option>
                <option>System Development</option>
                <option>Cloud & Microsoft Solutions</option>
                <option>Security & Access Control</option>
                <option>Audio & Video Conferencing</option>
                <option>IoT & Smart Technologies</option>
                <option>Backup & Recovery</option>
              </select>
            </div>
            <div class="field"><label for="tPriority">Priority</label>
              <select id="tPriority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select>
            </div>
          </div>
          <div class="field"><label for="tDesc">Description</label><textarea id="tDesc" placeholder="Describe the issue, who's affected, and when it started…"></textarea><div class="err">Please describe the issue.</div></div>
          <button type="submit" class="btn btn-primary btn-block">Submit Ticket</button>
        </form>
      </div>
    </div>
  </div>

  <!-- NEW QUOTE MODAL -->
  <div class="modal-overlay" id="quoteModal">
    <div class="modal">
      <div class="modal__head"><h3>Request a quote</h3><button class="modal__close" data-close="quoteModal">&times;</button></div>
      <div class="modal__body">
        <form id="quoteForm" novalidate>
          <div class="field"><label for="qService">Service needed</label>
            <select id="qService">
              <option>IT Infrastructure & Support</option>
              <option>Cybersecurity</option>
              <option>System Development</option>
              <option>Cloud & Microsoft Solutions</option>
              <option>Security & Access Control</option>
              <option>Audio & Video Conferencing</option>
              <option>IoT & Smart Technologies</option>
              <option>Backup & Recovery</option>
            </select>
          </div>
          <div class="field"><label for="qBudget">Estimated budget</label>
            <select id="qBudget">
              <option>Not sure yet</option>
              <option>Under P10,000</option>
              <option>P10,000 – P50,000</option>
              <option>P50,000 – P150,000</option>
              <option>P150,000+</option>
            </select>
          </div>
          <div class="field"><label for="qDetails">Project details</label><textarea id="qDetails" placeholder="What are you trying to achieve?"></textarea><div class="err">Please add some details.</div></div>
          <button type="submit" class="btn btn-primary btn-block">Send Request</button>
        </form>
      </div>
    </div>
  </div>

  <script src="js/db.js?v=13"></script>
  <script src="js/ui.js?v=13"></script>
  <script src="js/fx.js?v=13"></script>
  <script src="js/portal.js?v=13"></script>
</body>
</html>
